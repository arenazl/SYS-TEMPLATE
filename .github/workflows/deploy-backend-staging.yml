name: Deploy Backend to Heroku Staging

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - 'Procfile'
      - 'runtime.txt'
      - '.github/workflows/deploy-backend-staging.yml'

jobs:
  deploy:
    name: Deploy to Heroku Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: "."
          buildpack: "heroku/python"

      - name: Verify deployment
        run: |
          echo "Backend deployed to Heroku staging successfully"
          echo "App URL: https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com"

      - name: Health check
        run: |
          sleep 10
          curl --fail --retry 3 --retry-delay 5 https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com/health || echo "Health check failed - please verify manually"
