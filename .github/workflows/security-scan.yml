name: Security Scan

on:
  # Run on PRs that change dependencies
  pull_request:
    paths:
      - 'requirements.txt'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/security-scan.yml'

  # Run weekly on Mondays at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  scan-python-dependencies:
    name: Scan Python Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11.6
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.6'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pip-audit
        run: |
          pip-audit --desc --format json --output pip-audit-report.json
        continue-on-error: true

      - name: Display pip-audit results
        if: always()
        run: |
          pip-audit --desc

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  scan-npm-dependencies:
    name: Scan NPM Dependencies
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --json > npm-audit-report.json
        continue-on-error: true

      - name: Display npm audit results
        if: always()
        run: |
          npm audit

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [scan-python-dependencies, scan-npm-dependencies]
    if: always()

    steps:
      - name: Download pip-audit report
        uses: actions/download-artifact@v4
        with:
          name: pip-audit-report
        continue-on-error: true

      - name: Download npm audit report
        uses: actions/download-artifact@v4
        with:
          name: npm-audit-report
        continue-on-error: true

      - name: Generate security summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Python Dependencies (pip-audit)" >> $GITHUB_STEP_SUMMARY
          if [ -f pip-audit-report.json ]; then
            VULN_COUNT=$(jq '.dependencies | length' pip-audit-report.json 2>/dev/null || echo "0")
            if [ "$VULN_COUNT" = "0" ]; then
              echo "✅ No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ $VULN_COUNT vulnerable dependencies found" >> $GITHUB_STEP_SUMMARY
              echo "See pip-audit-report artifact for details" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ Report not available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### NPM Dependencies (npm audit)" >> $GITHUB_STEP_SUMMARY
          if [ -f npm-audit-report.json ]; then
            VULN_COUNT=$(jq '.metadata.vulnerabilities.total' npm-audit-report.json 2>/dev/null || echo "0")
            if [ "$VULN_COUNT" = "0" ]; then
              echo "✅ No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ $VULN_COUNT vulnerabilities found" >> $GITHUB_STEP_SUMMARY
              CRITICAL=$(jq '.metadata.vulnerabilities.critical' npm-audit-report.json 2>/dev/null || echo "0")
              HIGH=$(jq '.metadata.vulnerabilities.high' npm-audit-report.json 2>/dev/null || echo "0")
              MODERATE=$(jq '.metadata.vulnerabilities.moderate' npm-audit-report.json 2>/dev/null || echo "0")
              LOW=$(jq '.metadata.vulnerabilities.low' npm-audit-report.json 2>/dev/null || echo "0")
              echo "  - Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
              echo "  - High: $HIGH" >> $GITHUB_STEP_SUMMARY
              echo "  - Moderate: $MODERATE" >> $GITHUB_STEP_SUMMARY
              echo "  - Low: $LOW" >> $GITHUB_STEP_SUMMARY
              echo "See npm-audit-report artifact for details" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ Report not available" >> $GITHUB_STEP_SUMMARY
          fi
